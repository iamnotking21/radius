# devops/ci/workflows/android.yml — SUPERSEDED, kept as a POINTER ONLY. Not a workflow.
#
# Owner: qa-test (this file is inside the "devops/ci/ TEST + GATE stages" carve-out, root
# CLAUDE.md REPO MAP). Decided here, by that owner, per HANDOFF-2 in devops/ci/runner/README.md
# ("It should be reduced to a pointer, by its owner").
#
# THIS FILE NO LONGER DEFINES ANY JOBS. Deliberately — it never actually ran (neither GitHub nor
# Gitea discovers workflows in devops/ci/, only in .github/workflows/ and .gitea/workflows/
# respectively; see this file's own original header, preserved in git history at commit c487b20),
# and once .github/workflows/ci.yml + .gitea/workflows/ci.yml + devops/ci/runner/run-stage.sh
# existed with real per-stage commands, a second, unwired copy of the same job list was a live
# drift risk masquerading as documentation: a stage's real command could change in run-stage.sh
# and this file would keep showing the old one, looking equally authoritative. A stale workflow
# file that LOOKS authoritative is exactly how someone edits the wrong thing and wonders why CI
# ignored them (B12 task brief). So: emptied, not deleted — deleting it would remove the only place
# that used to record several real, dated findings (the 116-vector count history, the 0xFDA9
# artifact-scan R8 correction, the MissingPermission fix); those are preserved in git history at
# the last commit that touched this file with real job bodies, not repeated here where they would
# rot the same way.
#
# WHERE THE REAL DEFINITIONS LIVE NOW:
#   trigger + runner labels + provider wiring  -> .github/workflows/ci.yml  (interim, B3 open)
#                                                  .github/workflows/release-gates.yml
#                                                  .gitea/workflows/ci.yml  (destination, dormant until B3)
#                                                  .gitea/workflows/release-gates.yml
#   WHICH COMMAND each stage runs               -> devops/ci/runner/run-stage.sh   (devops-tencent)
#   the check logic itself                       -> devops/ci/gates/*.sh            (qa-test)
#   gate-selftests synthetic fixtures             -> devops/ci/tests/gates/*.sh      (qa-test)
#   current gate status / how to run locally      -> devops/ci/README.md            (qa-test)
#
# If you are looking for "what job runs what command", start at devops/ci/runner/run-stage.sh's
# `run_stage()` case statement — it is the one and only place that answer lives.
