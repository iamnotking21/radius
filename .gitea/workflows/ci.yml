# .gitea/workflows/ci.yml — ORDINARY PUSH / PR PATH, SELF-HOSTED GITEA ACTIONS
#
# Owner: devops-tencent. THIS IS THE DESTINATION; .github/workflows/ci.yml is the interim.
# ADR-003 + root CLAUDE.md: "CI: Gitea Actions self-host".
#
# STATUS: DORMANT UNTIL BLOCKER B3 CLOSES. No Gitea instance exists because Tencent is not
# provisioned. This file is committed now, not later, for one reason: the two providers must share
# their stage definitions from day one, or the "temporary" GitHub workflow becomes the only one that
# is ever maintained and the migration back to Gitea quietly becomes a rewrite.
#
# HOW DRIFT IS PREVENTED: this file and .github/workflows/ci.yml contain ZERO commands of their own.
# Both call devops/ci/runner/run-stage.sh with the same stage names. Change a stage in one place.
# The differences between the two files are exactly three, all of them genuinely provider-specific:
#   1. `runs-on` labels          — hosted images vs our runner labels.
#   2. `actions/setup-java`      — absent here. A self-hosted runner IMAGE provides JDK 21 and the
#                                  Android SDK (devops/ci/runner/README.md). Downloading a JDK on
#                                  every run of a machine we own is waste, and it is one less
#                                  external action to trust.
#   3. the conformance job       — see HANDOFF-1 below.
#
# BEFORE THIS FILE CAN RUN, devops-tencent must (all tracked in devops/ci/runner/README.md):
#   * provision Gitea + act_runner in OpenTofu/Ansible. Nothing configured by hand, ever.
#   * build the runner image: JDK 21 (Temurin), Android SDK platform 35 + build-tools, Node 20+,
#     bash, coreutils, git. NO Mac needed for the Android path.
#   * register the runner with labels: self-hosted, linux, android.
#   * set Gitea's DEFAULT_ACTIONS_URL (or mirror actions/checkout into the local Gitea org) so
#     `uses:` resolves. A self-hosted CI that silently fetches actions from github.com on every run
#     has quietly reintroduced the dependency we self-hosted to remove — mirror it.

name: ci

on:
  push:
    paths:
      - "mobile/**"
      - "devops/ci/**"
      - ".github/workflows/**"
      - ".gitea/workflows/**"
  pull_request:
    paths:
      - "mobile/**"
      - "devops/ci/**"
      - ".github/workflows/**"
      - ".gitea/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================================================
  # FAST GATES — bash + coreutils only. ALL BLOCKING. The safety-invariant gates.
  # ================================================================================================
  fast-gates:
    name: fast gates (blocking)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: gate self-tests
        run: bash devops/ci/runner/run-stage.sh gate-selftests
      - name: "safety invariant 1 — no map / no lat-lng / no bearing"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-no-map-no-bearing
      - name: "decision 43 / B11 — internal symbol escape"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-internal-escape
      - name: "decision 41 — THE LINE (Crypto.kt pinned surface)"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-the-line
      # CLAIMS_REGISTER G1 / row A2 — raw RSSI must never leave the device.
      - name: "G1 / A2 — raw RSSI must not leave the device"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-rssi-egress

  # ================================================================================================
  # KNOWN-RED GATES — run, report loudly, do NOT block the ordinary path. BLOCKING on release.
  # Reasoning lives in ONE place: the KNOWN-RED REGISTRY comment in devops/ci/runner/run-stage.sh.
  # ================================================================================================
  known-red-gates:
    name: known-red gates (non-blocking here, BLOCKING on release)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: "decision 34 / B9 / B11 — 0xFDA9 must not ship (source scan)"
        run: bash devops/ci/runner/run-stage.sh gate-release-uuid-source
      - name: "battery contract (<4%/hr scanning, <1%/day idle) — no hardware rig exists"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-battery

  # ================================================================================================
  # ANDROID BUILD + CONFORMANCE. ALL BLOCKING.
  #
  # HANDOFF-1 / B12 CLOSED. The conformance stage is now viable on a Linux runner: qa-test replaced
  # conformance_gate.sh's hardcoded `./gradlew.bat` with qa_gradle_wrapper() in
  # devops/ci/gates/lib/common.sh — the same uname rule as run-stage.sh's gradle_wrapper(), reused
  # rather than duplicated, with 6 self-test assertions covering every branch. This was the last
  # thing standing between this file and being runnable; what remains is B3 (no Gitea instance).
  #
  # STILL UNPROVEN ANYWHERE: an actual Linux execution of the Android build. Nobody on this project
  # owns a Linux machine, so the first real Linux run will be either GitHub's ubuntu-latest
  # (.github/workflows/ci.yml, interim) or this runner. If it fails, read
  # devops/ci/runner/README.md "FIRST UBUNTU RUN — ATTRIBUTION" before blaming the code.
  #
  # No Mac on any path — iOS is DEFERRED (B4).
  # ================================================================================================
  android:
    name: android build + conformance (blocking)
    runs-on: [self-hosted, linux, android]
    steps:
      - uses: actions/checkout@v4
      - name: ":shared:testDebugUnitTest + :android:testDebugUnitTest"
        run: bash devops/ci/runner/run-stage.sh build-unit-test
      - name: ":android:lintDebug"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh build-lint
      - name: ":android:assembleDebug"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh build-assemble-debug
      # CLAIMS_REGISTER G2 / row A4, decision 50. A PAIR — must stay adjacent, in this order, in
      # this job: the gate reads both variants' merged manifests out of the workspace and the stage
      # above it is what writes them. Manifest-merge only, no compile/R8/signing. Full rationale in
      # .github/workflows/ci.yml and run-stage.sh's `build-manifests` case.
      - name: "merged manifests, both variants (input to the permission gate)"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh build-manifests
      - name: "G2 / A4 — merged-manifest permission allowlist (decision 50)"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-permission
      - name: "conformance vectors (BLE codec — authoritative)"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-conformance
