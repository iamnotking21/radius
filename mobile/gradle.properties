# Radius mobile — Gradle properties

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Kotlin/Native
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

# Kotlin/Native on a machine without Xcode cannot build iOS targets at all (blocker B4).
# This flag only silences the *warning*; it does not make iOS build on Windows.
kotlin.mpp.applyDefaultHierarchyTemplate=true
