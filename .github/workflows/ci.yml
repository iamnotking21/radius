# .github/workflows/ci.yml — ORDINARY PUSH / PR PATH
#
# Owner: devops-tencent (CI RUNNER + workflow discovery). The gates this file invokes are qa-test's
# and live in devops/ci/gates/ — nothing in this file reimplements a check. Every `run:` here calls
# devops/ci/runner/run-stage.sh, which is the ONE place a stage's command is defined, shared
# verbatim with .gitea/workflows/ci.yml so the two providers cannot drift.
#
# WHY GITHUB ACTIONS AT ALL — ADR-003 says self-hosted Gitea Actions, and it still does.
#   Today the code lives at github.com/iamnotking21/radius and no Gitea instance exists (blocker B3,
#   Tencent not provisioned). The choice was: gates that genuinely run on a third-party CI now, or
#   gates that run nowhere for as long as B3 stays open. Six gates that nobody executes are worse
#   than no gates, because they invite people to believe checks are running.
#   This is therefore INTERIM AND DUAL-TARGETED, not a stack change:
#     * .gitea/workflows/ci.yml is committed alongside this file and is the destination.
#     * all logic is in devops/ci/runner/ + devops/ci/gates/, i.e. in plain bash we own. GitHub holds
#       no configuration, no logic, and no secret. Deleting this file costs us nothing.
#     * no GitHub-proprietary feature is used. No Actions cache semantics we depend on, no
#       environments, no OIDC, no marketplace action beyond checkout/setup-java.
#   ADR-003's actual objection is lock-in and third parties holding our data. Neither applies to a
#   build runner executing our own scripts on our own public source. It DOES apply the moment CI
#   handles signing keys or user data — which is the line: nothing that touches a secret is wired
#   here, and it must not be. Migrate to Gitea when B3 closes. Orchestrator: this warrants a short
#   ADR; see "ADR PROPOSAL" in devops/ci/runner/README.md.

name: ci

on:
  push:
    paths:
      - "mobile/**"
      - "devops/ci/**"
      - ".github/workflows/**"
      - ".gitea/workflows/**"
  pull_request:
    paths:
      - "mobile/**"
      - "devops/ci/**"
      - ".github/workflows/**"
      - ".gitea/workflows/**"
  workflow_dispatch:

# Superseded runs are cancelled. Windows minutes bill at 2x on private repos and the Android job is
# the expensive one — see devops/ci/runner/README.md "COST".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ================================================================================================
  # FAST GATES — bash + coreutils only. No JDK, no Android SDK, no network. Seconds.
  # ALL BLOCKING. These are the safety-invariant gates; they are the ones that must never be soft.
  # ================================================================================================
  fast-gates:
    name: fast gates (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs qa-test's own self-test suite against SYNTHETIC fixtures. This is what proves the gate
      # scripts still detect what they claim to detect, and it is why the known-red tolerance in the
      # next job cannot quietly mask a broken gate script.
      - name: gate self-tests
        run: bash devops/ci/runner/run-stage.sh gate-selftests

      - name: "safety invariant 1 — no map / no lat-lng / no bearing"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-no-map-no-bearing

      - name: "decision 43 / B11 — internal symbol escape"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-internal-escape

      - name: "decision 41 — THE LINE (Crypto.kt pinned surface)"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-the-line

  # ================================================================================================
  # KNOWN-RED GATES — run, report loudly, do NOT block the ordinary path.
  #
  # These two gates are red because of facts about the world (no SIG-allocated UUID; no hardware
  # rig), not because of anything a PR author did or can fix. Blocking every push on them would make
  # CI permanently red for months, and a permanently-red CI is an ignored CI — so by the time 0xFDA9
  # actually matters, on the day we try to ship, nobody would be reading it.
  #
  # They are NOT silenced. run-stage.sh asserts the EXPECTED state: still-failing prints the full
  # reason into the job summary every run and passes the stage; started-PASSING fails the stage and
  # tells you to remove the tolerance. Full reasoning at the KNOWN-RED REGISTRY comment in
  # devops/ci/runner/run-stage.sh.
  #
  # ON THE RELEASE PATH THEY BLOCK. See .github/workflows/release-gates.yml. We cannot ship while
  # either is red, and CI says so at the only moment where saying so is actionable.
  # ================================================================================================
  known-red-gates:
    name: known-red gates (non-blocking here, BLOCKING on release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "decision 34 / B9 / B11 — 0xFDA9 must not ship (source scan)"
        run: bash devops/ci/runner/run-stage.sh gate-release-uuid-source

      - name: "battery contract (<4%/hr scanning, <1%/day idle) — no hardware rig exists"
        if: ${{ !cancelled() }}
        run: bash devops/ci/runner/run-stage.sh gate-battery

  # ================================================================================================
  # ANDROID BUILD + CONFORMANCE — the expensive job. ALL BLOCKING.
  #
  # UBUNTU since B12 closed (qa-test made conformance_gate.sh's Gradle wrapper call OS-aware via
  # qa_gradle_wrapper() in devops/ci/gates/lib/common.sh; 45/45 gate self-tests, 6 of them covering
  # every uname branch). This job ran on windows-latest only because that gate hardcoded
  # `./gradlew.bat`.
  #
  # WHY UBUNTU IS THE LOWER-RISK CHOICE, not the riskier one — worth stating because the intuition
  # runs the other way. "Everything was verified green on Windows" is true of a specific dev
  # machine: local Android SDK at a known path, a local.properties, warm Gradle caches. GitHub's
  # windows-latest is none of those things. So this is not proven-Windows vs unproven-Ubuntu; it is
  # two unproven hosted images, and ubuntu-latest is by a wide margin the better-trodden one for
  # Android CI, at 1x billed minutes instead of 2x, on the same OS family as the self-hosted Gitea
  # runner this all migrates to. Staying on Windows would have bought a false sense of control on
  # the less standard image.
  #
  # IF THE FIRST UBUNTU RUN FAILS: read devops/ci/runner/README.md "FIRST UBUNTU RUN — ATTRIBUTION"
  # BEFORE filing anything. A runner-image problem must not be recorded as a code regression. The
  # preflight in run-stage.sh already fails in ~1s with an unmistakably runner-shaped message when
  # the SDK is the problem, and the one-line bisect (flip this back to windows-latest) is documented.
  #
  # NO macOS JOB. iOS is DEFERRED (blocker B4, no Mac). Kotlin/Native iOS targets are host-guarded
  # and skip with a warning; there is nothing here for a Mac to do, and adding a job that pretends
  # otherwise would be the same category of lie as a green battery gate.
  # ================================================================================================
  android:
    name: android build + conformance (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Every step below runs even if an earlier one failed. One red step should tell you everything
      # that is broken, not the first thing that is broken.
      #
      # `shell: bash` is redundant on ubuntu (it is already the default) and kept on purpose: it is
      # what makes the documented bisect in devops/ci/runner/README.md §5b genuinely ONE line —
      # flip runs-on to windows-latest and these steps still run, because Git Bash is selected
      # explicitly rather than inherited from the OS.
      - name: ":shared:testDebugUnitTest + :android:testDebugUnitTest"
        shell: bash
        run: bash devops/ci/runner/run-stage.sh build-unit-test

      - name: ":android:lintDebug"
        if: ${{ !cancelled() }}
        shell: bash
        run: bash devops/ci/runner/run-stage.sh build-lint

      - name: ":android:assembleDebug"
        if: ${{ !cancelled() }}
        shell: bash
        run: bash devops/ci/runner/run-stage.sh build-assemble-debug

      # THE MOAT GATE. Phase 1 = manifest pre-check (node). Phase 2 = the BLE codec actually run
      # against every conformance vector, count reported live, never hardcoded.
      # Android only — iOS is DEFERRED and the gate says so in its own output rather than implying
      # full-platform coverage.
      - name: "conformance vectors (BLE codec — authoritative)"
        if: ${{ !cancelled() }}
        shell: bash
        run: bash devops/ci/runner/run-stage.sh gate-conformance
